.ft{max-width:1344px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:24px}.fb{display:flex;gap:12px;flex-wrap:wrap}.fb .btn{margin:0}.btn.ol{background:none;border:1.5px solid #fff}.btn.ol:hover{background:#fff;color:#0A0A0A}.fs{max-width:1344px;margin:36px auto 0;padding-top:24px;border-top:1px solid #ffffff33;display:flex;gap:10px 28px;flex-wrap:wrap;font-weight:600;font-size:14px}.fs a:hover{color:#5BA0FF}.fl{display:flex;gap:40px;align-items:center;flex-wrap:wrap}address{font-style:normal;font-size:14px;line-height:1.6;color:#fff;font-weight:500;border-left:1px solid #ffffff44;padding-left:40px}@media(max-width:640px){address{border:0;padding:0}}.none{padding:24px 0;color:#555;font-size:15px}@media(max-width:640px){
header{align-items:center!important;flex-wrap:wrap!important;padding-top:14px!important;padding-bottom:14px!important}
body[data-h=D] header{padding-bottom:14px!important;background:linear-gradient(#000d,#0000)}
body.mo header{background:#0A0A0A!important}
header img.lw{height:34px!important}
.mb{display:block!important;margin-left:auto;background:none;border:1.5px solid #fff;width:42px;height:38px;padding:0;cursor:pointer;position:relative}
.mb::before,.mb::after,.mb i{content:'';position:absolute;left:10px;right:10px;height:2px;background:#fff;transition:.2s}.mb::before{top:11px}.mb i{top:17px}.mb::after{top:23px}
body.mo .mb::before{top:17px;transform:rotate(45deg)}body.mo .mb::after{top:17px;transform:rotate(-45deg)}body.mo .mb i{opacity:0}
header nav{display:none!important;width:100%;flex-direction:column;gap:0;order:3;border-top:1px solid #ffffff33;margin-top:6px}
header nav a{padding:14px 0;border-bottom:1px solid #ffffff22;font-size:18px}
header .cta{display:none!important;order:4;width:100%;text-align:center;margin-top:6px;padding:13px}
body.mo header nav{display:flex!important}body.mo header .cta{display:block!important}
body[data-h=D] .sl{padding:92px 20px 88px;min-height:0}
.sl .in{gap:24px}.sl.rel .m{flex:0 1 auto;width:min(100%,260px)}.sl .in>.m,.sl .in>.x{flex-basis:100%}
.sl h1{font-size:36px}.sl p{font-size:15px}.sl .btn{padding:12px 22px}
.dots{left:20px;bottom:36px}.arr{right:20px;bottom:26px}.arr button{width:36px;height:36px}

.mb{display:none}

<script>
document.body.dataset.h='D';
const $=id=>document.getElementById(id);
const fmt=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let R=[],F='',N=1000;
function draw(){const L=R.filter(r=>!F||r.labels.includes(F)),sh=L.slice(0,N);
$('rels').innerHTML=sh.map(r=>{const u=r.songshare_url||r.spotify_url,t=u?'a':'div';return `<${t} ${u?'href="'+esc(u)+'" target="_blank" rel="noopener"':''} class="card">${r.image_url?`<img class="img sq" loading="lazy" src="${esc(r.image_url)}" alt="${esc(r.name)}">`:`<div class="ph">PHOTO</div>`}<div class="t">${esc(r.name)}</div><div class="s">${esc(r.labels.join(' · '))}</div></${t}>`}).join('');
$('more').style.display=L.length>N?'inline-block':'none'}
$('more').onclick=()=>{N+=40;draw()};
(async()=>{try{const r=await (await fetch('data/roster.json',{cache:'no-store'})).json();let H=[];try{H=((await (await fetch('data/roster_hidden.json',{cache:'no-store'})).json()).hidden_names||[]).map(x=>x.toLowerCase())}catch(e){}
R=r.artists.filter(x=>!H.includes(x.name.toLowerCase()));let P=[];try{P=((await (await fetch('data/roster_pinned.json',{cache:'no-store'})).json()).pinned_names||[]).map(x=>x.toLowerCase())}catch(e){}
const pi=x=>{const i=P.indexOf(x.name.toLowerCase());return i<0?1e9:i};R=R.map((x,i)=>[x,i]).sort((a,b)=>pi(a[0])-pi(b[0])||a[1]-b[1]).map(x=>x[0]);
const L=[...new Set(R.flatMap(x=>x.labels))];$('chips').innerHTML=['All',...L].map(l=>`<button class="chip${l==='All'?' on':''}" data-l="${l==='All'?'':esc(l)}">${esc(l)}</button>`).join('');
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));F=b.dataset.l;draw()};
draw();($('status')||{}).textContent='Test build · '+R.length+' artists, data generated '+r.generated_at}
catch(e){$('rels').innerHTML='<div class="none">The roster is on its way.</div>'}})();
</script></body></html>
